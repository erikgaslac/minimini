<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel de Gestión Académica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
  :root{
    --bg: #0F1720;
    --panel: #16212C;
    --panel-2: #1C2A38;
    --border: #263543;
    --ink: #E7EDF3;
    --ink-dim: #93A4B5;
    --accent: #3FB6A8;
    --accent-2: #E0A458;
    --accent-3: #6C8EEF;
    --danger: #E0645C;
    --radius: 10px;
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    min-height:100vh;
  }
  header{
    padding: 20px 28px;
    border-bottom: 1px solid var(--border);
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:14px;
    position: sticky;
    top:0;
    background: rgba(15,23,32,0.92);
    backdrop-filter: blur(6px);
    z-index: 50;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .brand .mark{
    font-weight:800;
    letter-spacing:0.5px;
    font-size:14px;
    color:var(--accent);
    border:1px solid var(--accent);
    border-radius:6px;
    padding:2px 8px;
  }
  .brand h1{
    font-size:17px;
    margin:0;
    font-weight:600;
    color:var(--ink);
  }
  .status-line{
    font-size:12px;
    color: var(--ink-dim);
  }
  .status-line .dot{
    display:inline-block;
    width:7px;
    height:7px;
    border-radius:50%;
    background: var(--accent);
    margin-right:6px;
    box-shadow: 0 0 0 3px rgba(63,182,168,0.15);
  }
  .status-line.loading .dot{ background: var(--accent-2); }
  .status-line.error .dot{ background: var(--danger); }

  .controls{
    display:flex;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  select, button{
    font-family:inherit;
    font-size:13px;
    border-radius: 8px;
    border:1px solid var(--border);
    background: var(--panel-2);
    color: var(--ink);
    padding:8px 12px;
    outline:none;
  }
  select:focus, button:focus{ border-color: var(--accent); }
  .btn-primary{
    background: var(--accent);
    color:#08201C;
    font-weight:600;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:6px;
  }
  .btn-primary:hover{ filter: brightness(1.08); }
  .btn-primary:disabled{ opacity:0.6; cursor:default; }
  .refresh-icon{
    display:inline-block;
    transition: transform 0.6s ease;
  }
  .spinning{ animation: spin 0.8s linear infinite; }
  @keyframes spin{ to{ transform: rotate(360deg);} }

  .auto-toggle{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    color: var(--ink-dim);
  }
  .switch{
    width:34px; height:20px;
    border-radius:20px;
    background: var(--panel-2);
    border:1px solid var(--border);
    position:relative;
    cursor:pointer;
    flex-shrink:0;
  }
  .switch.on{ background: rgba(63,182,168,0.25); border-color: var(--accent); }
  .switch .knob{
    position:absolute; top:1px; left:1px;
    width:16px; height:16px;
    border-radius:50%;
    background: var(--ink-dim);
    transition: all 0.2s ease;
  }
  .switch.on .knob{ left:15px; background: var(--accent); }

  main{ padding: 24px 28px 60px; max-width:1500px; margin:0 auto; }

  .filters{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(170px,1fr));
    gap:10px;
    background: var(--panel);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding:16px;
    margin-bottom:22px;
  }
  .filter-field label{
    display:block;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.5px;
    color: var(--ink-dim);
    margin-bottom:5px;
  }
  .filter-field select{ width:100%; }
  .filters-actions{
    grid-column: 1 / -1;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-top:6px;
    border-top:1px dashed var(--border);
    margin-top:4px;
  }
  .filters-actions span{ font-size:12px; color:var(--ink-dim); }
  .link-btn{
    background:none; border:none; color: var(--accent-3);
    font-size:12px; cursor:pointer; padding:0;
  }
  .link-btn:hover{ text-decoration:underline; }

  .kpis{
    display:grid;
    grid-template-columns: repeat(auto-fit, minmax(190px,1fr));
    gap:14px;
    margin-bottom:22px;
  }
  .kpi{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding:16px 18px;
    position:relative;
    overflow:hidden;
  }
  .kpi::before{
    content:"";
    position:absolute; left:0; top:0; bottom:0; width:3px;
    background: var(--accent);
  }
  .kpi:nth-child(2)::before{ background: var(--accent-2); }
  .kpi:nth-child(3)::before{ background: var(--accent-3); }
  .kpi:nth-child(4)::before{ background: var(--danger); }
  .kpi .label{ font-size:12px; color:var(--ink-dim); margin-bottom:6px; }
  .kpi .value{ font-size:26px; font-weight:700; }

  .grid-charts{
    display:grid;
    grid-template-columns: 1.3fr 1fr;
    gap:16px;
    margin-bottom:16px;
  }
  .grid-charts-2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap:16px;
    margin-bottom:22px;
  }
  @media (max-width: 900px){
    .grid-charts, .grid-charts-2{ grid-template-columns: 1fr; }
  }
  .card{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding:16px;
  }
  .card h3{
    margin:0 0 12px 0;
    font-size:13px;
    font-weight:600;
    color: var(--ink);
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .chart-wrap{ position:relative; height:280px; }

  .table-card{
    background: var(--panel);
    border:1px solid var(--border);
    border-radius: var(--radius);
    padding:16px;
  }
  .table-head{
    display:flex; justify-content:space-between; align-items:center;
    margin-bottom:12px; gap:10px; flex-wrap:wrap;
  }
  .table-head h3{ margin:0; font-size:13px; text-transform:uppercase; letter-spacing:0.4px; }
  #searchInput{
    width:240px;
  }
  .table-scroll{
    overflow:auto;
    max-height: 480px;
    border:1px solid var(--border);
    border-radius:8px;
  }
  table{ width:100%; border-collapse: collapse; font-size:12.5px; }
  thead th{
    position:sticky; top:0;
    background: var(--panel-2);
    text-align:left;
    padding:9px 10px;
    color: var(--ink-dim);
    font-weight:600;
    cursor:pointer;
    white-space:nowrap;
    border-bottom:1px solid var(--border);
  }
  thead th:hover{ color: var(--ink); }
  tbody td{
    padding:8px 10px;
    border-bottom:1px solid var(--border);
    white-space:nowrap;
    color: var(--ink);
  }
  tbody tr:hover{ background: rgba(255,255,255,0.03); }
  .table-footer{
    display:flex; justify-content:space-between; align-items:center;
    margin-top:10px; font-size:12px; color:var(--ink-dim);
  }

  .empty-state, .loading-state, .error-state{
    text-align:center;
    padding: 60px 20px;
    color: var(--ink-dim);
  }
  .error-state{ color: var(--danger); }
  .error-state code{
    display:block;
    background: var(--panel-2);
    padding:10px;
    border-radius:6px;
    margin-top:10px;
    font-size:11px;
    text-align:left;
    overflow:auto;
    color: var(--ink-dim);
  }

  ::-webkit-scrollbar{ width:9px; height:9px; }
  ::-webkit-scrollbar-thumb{ background: var(--border); border-radius:6px; }
  ::-webkit-scrollbar-track{ background: transparent; }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="mark">IDAT</span>
    <h1>Panel de Gestión Académica</h1>
  </div>

  <div class="controls">
    <div class="status-line" id="statusLine"><span class="dot"></span><span id="statusText">Sin datos</span></div>

    <div class="auto-toggle">
      <span>Auto</span>
      <div class="switch" id="autoSwitch"><div class="knob"></div></div>
    </div>

    <select id="intervalSelect">
      <option value="15000">Cada 15 s</option>
      <option value="30000" selected>Cada 30 s</option>
      <option value="60000">Cada 1 min</option>
      <option value="300000">Cada 5 min</option>
      <option value="900000">Cada 15 min</option>
    </select>

    <button class="btn-primary" id="refreshBtn">
      <span class="refresh-icon" id="refreshIcon">&#8635;</span> Actualizar
    </button>
  </div>
</header>

<main>

  <section class="filters" id="filtersSection">
    <div class="filter-field">
      <label>Periodo</label>
      <select id="f_periodo"><option value="">Todos</option></select>
    </div>
    <div class="filter-field">
      <label>Carrera</label>
      <select id="f_carrera"><option value="">Todas</option></select>
    </div>
    <div class="filter-field">
      <label>Modalidad Curso</label>
      <select id="f_modalidad"><option value="">Todas</option></select>
    </div>
    <div class="filter-field">
      <label>Docente</label>
      <select id="f_docente"><option value="">Todos</option></select>
    </div>
    <div class="filter-field">
      <label>Condición Periodo</label>
      <select id="f_condicion"><option value="">Todas</option></select>
    </div>
    <div class="filter-field">
      <label>Tipo Docente</label>
      <select id="f_tipodocente"><option value="">Todos</option></select>
    </div>
    <div class="filters-actions">
      <span id="filterSummary">Sin filtros aplicados</span>
      <button class="link-btn" id="clearFilters">Limpiar filtros</button>
    </div>
  </section>

  <section class="kpis">
    <div class="kpi">
      <div class="label">Total alumnos</div>
      <div class="value" id="kpiAlumnos">—</div>
    </div>
    <div class="kpi">
      <div class="label">Secciones</div>
      <div class="value" id="kpiSecciones">—</div>
    </div>
    <div class="kpi">
      <div class="label">Docentes únicos</div>
      <div class="value" id="kpiDocentes">—</div>
    </div>
    <div class="kpi">
      <div class="label">Promedio alumnos / sección</div>
      <div class="value" id="kpiPromedio">—</div>
    </div>
  </section>

  <div id="dataArea">
    <div class="loading-state">Cargando datos desde Google Sheets…</div>
  </div>

</main>

<script>
/* ======= CONFIGURACIÓN ======= */
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwqpq_i8KBiKCJnGgnAVspjhsUMg7WgdKB3wBPvtrGBdbx6Wz613ga-s2tAtmF4SwbckA/exec";

/* ======= ESTADO ======= */
let rawData = [];
let filteredData = [];
let charts = {};
let autoRefresh = false;
let intervalHandle = null;
let sortState = { key: null, dir: 1 };

const els = {
  statusLine: document.getElementById('statusLine'),
  statusText: document.getElementById('statusText'),
  refreshBtn: document.getElementById('refreshBtn'),
  refreshIcon: document.getElementById('refreshIcon'),
  autoSwitch: document.getElementById('autoSwitch'),
  intervalSelect: document.getElementById('intervalSelect'),
  dataArea: document.getElementById('dataArea'),
  filterSummary: document.getElementById('filterSummary'),
};

const FILTER_MAP = {
  f_periodo: 'Periodo',
  f_carrera: 'Carrera',
  f_modalidad: 'Modalidad Curso',
  f_docente: 'Docente',
  f_condicion: 'Condición Periodo',
  f_tipodocente: 'Tipo Docente',
};

/* ======= CARGA DE DATOS ======= */
async function fetchData(isManual){
  setStatus('loading', 'Actualizando…');
  els.refreshBtn.disabled = true;
  els.refreshIcon.classList.add('spinning');

  try{
    const res = await fetch(SCRIPT_URL, { method: 'GET' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const json = await res.json();
    if(!Array.isArray(json)) throw new Error('La respuesta no es un arreglo JSON válido.');

    rawData = json.map(r => ({
      ...r,
      Alumnos: Number(r['Alumnos']) || 0,
      Sesiones: Number(r['Sesiones']) || 0,
    }));

    populateFilters(rawData);
    applyFilters();
    setStatus('ok', 'Actualizado ' + new Date().toLocaleTimeString('es-PE'));
  }catch(err){
    console.error(err);
    setStatus('error', 'Error al actualizar');
    if(rawData.length === 0){
      els.dataArea.innerHTML = `
        <div class="error-state">
          No se pudieron cargar los datos desde Google Apps Script.
          <code>${escapeHtml(err.message || String(err))}</code>
          Verifica que la Web App esté implementada con acceso "Cualquier usuario" y que la URL sea correcta.
        </div>`;
    }
  }finally{
    els.refreshBtn.disabled = false;
    els.refreshIcon.classList.remove('spinning');
  }
}

function setStatus(kind, text){
  els.statusLine.className = 'status-line' + (kind === 'loading' ? ' loading' : kind === 'error' ? ' error' : '');
  els.statusText.textContent = text;
}

/* ======= FILTROS ======= */
function populateFilters(data){
  Object.entries(FILTER_MAP).forEach(([id, field]) => {
    const select = document.getElementById(id);
    const current = select.value;
    const values = Array.from(new Set(data.map(r => r[field]).filter(v => v !== undefined && v !== ''))).sort();
    select.innerHTML = `<option value="">Todos</option>` + values.map(v => `<option value="${escapeAttr(v)}">${escapeHtml(v)}</option>`).join('');
    if(values.includes(current)) select.value = current;
  });
}

function getActiveFilters(){
  const active = {};
  Object.entries(FILTER_MAP).forEach(([id, field]) => {
    const val = document.getElementById(id).value;
    if(val) active[field] = val;
  });
  return active;
}

function applyFilters(){
  const active = getActiveFilters();
  filteredData = rawData.filter(row =>
    Object.entries(active).every(([field, val]) => String(row[field]) === val)
  );

  const count = Object.keys(active).length;
  els.filterSummary.textContent = count === 0 ? 'Sin filtros aplicados' : `${count} filtro(s) aplicado(s) · ${filteredData.length} de ${rawData.length} filas`;

  renderAll();
}

Object.keys(FILTER_MAP).forEach(id => {
  document.getElementById(id).addEventListener('change', applyFilters);
});
document.getElementById('clearFilters').addEventListener('click', () => {
  Object.keys(FILTER_MAP).forEach(id => document.getElementById(id).value = '');
  applyFilters();
});

/* ======= RENDER ======= */
function renderAll(){
  if(filteredData.length === 0){
    els.dataArea.innerHTML = `<div class="empty-state">No hay datos que coincidan con los filtros seleccionados.</div>`;
    return;
  }

  ensureLayout();
  renderKpis();
  renderCharts();
  renderTable();
}

function ensureLayout(){
  if(document.getElementById('chartsGrid')) return;
  els.dataArea.innerHTML = `
    <div class="grid-charts">
      <div class="card">
        <h3>Alumnos por Carrera</h3>
        <div class="chart-wrap"><canvas id="chartCarrera"></canvas></div>
      </div>
      <div class="card">
        <h3>Distribución por Modalidad</h3>
        <div class="chart-wrap"><canvas id="chartModalidad"></canvas></div>
      </div>
    </div>
    <div class="grid-charts-2">
      <div class="card">
        <h3>Top 10 Docentes por Alumnos</h3>
        <div class="chart-wrap"><canvas id="chartDocentes"></canvas></div>
      </div>
      <div class="card">
        <h3>Alumnos por Periodo</h3>
        <div class="chart-wrap"><canvas id="chartPeriodo"></canvas></div>
      </div>
    </div>
    <div class="table-card" id="chartsGrid">
      <div class="table-head">
        <h3>Detalle de secciones</h3>
        <input type="text" id="searchInput" placeholder="Buscar en la tabla…">
      </div>
      <div class="table-scroll">
        <table>
          <thead><tr id="tableHeadRow"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="table-footer">
        <span id="tableCount"></span>
      </div>
    </div>
  `;
  document.getElementById('searchInput').addEventListener('input', renderTable);
}

function renderKpis(){
  const totalAlumnos = filteredData.reduce((s, r) => s + r.Alumnos, 0);
  const secciones = new Set(filteredData.map(r => r['Sección'] || r['Seccion'])).size;
  const docentes = new Set(filteredData.map(r => r['Docente'])).size;
  const promedio = secciones ? (totalAlumnos / secciones) : 0;

  document.getElementById('kpiAlumnos').textContent = totalAlumnos.toLocaleString('es-PE');
  document.getElementById('kpiSecciones').textContent = secciones.toLocaleString('es-PE');
  document.getElementById('kpiDocentes').textContent = docentes.toLocaleString('es-PE');
  document.getElementById('kpiPromedio').textContent = promedio.toFixed(1);
}

function aggregate(data, keyField, valueField){
  const map = {};
  data.forEach(r => {
    const key = r[keyField] || 'Sin dato';
    map[key] = (map[key] || 0) + (r[valueField] || 0);
  });
  return map;
}

function destroyChart(id){
  if(charts[id]){ charts[id].destroy(); delete charts[id]; }
}

const palette = ['#3FB6A8','#E0A458','#6C8EEF','#E0645C','#9C7CE0','#5CC0E0','#B7D976','#E08FD0'];

function renderCharts(){
  // Carrera
  const carreraMap = aggregate(filteredData, 'Carrera', 'Alumnos');
  const carreraSorted = Object.entries(carreraMap).sort((a,b) => b[1]-a[1]).slice(0, 12);
  destroyChart('carrera');
  charts.carrera = new Chart(document.getElementById('chartCarrera'), {
    type: 'bar',
    data: {
      labels: carreraSorted.map(([k]) => truncate(k, 28)),
      datasets: [{ label: 'Alumnos', data: carreraSorted.map(([,v]) => v), backgroundColor: '#3FB6A8', borderRadius: 4 }]
    },
    options: baseOptions({ indexAxis: 'y' })
  });

  // Modalidad
  const modMap = aggregate(filteredData, 'Modalidad Curso', 'Alumnos');
  destroyChart('modalidad');
  charts.modalidad = new Chart(document.getElementById('chartModalidad'), {
    type: 'doughnut',
    data: {
      labels: Object.keys(modMap),
      datasets: [{ data: Object.values(modMap), backgroundColor: palette }]
    },
    options: { responsive:true, maintainAspectRatio:false, plugins:{ legend:{ position:'bottom', labels:{ color:'#93A4B5', boxWidth:10, font:{size:11} } } } }
  });

  // Docentes
  const docMap = aggregate(filteredData, 'Docente', 'Alumnos');
  const docSorted = Object.entries(docMap).sort((a,b) => b[1]-a[1]).slice(0, 10);
  destroyChart('docentes');
  charts.docentes = new Chart(document.getElementById('chartDocentes'), {
    type: 'bar',
    data: {
      labels: docSorted.map(([k]) => truncate(k, 24)),
      datasets: [{ label: 'Alumnos', data: docSorted.map(([,v]) => v), backgroundColor: '#E0A458', borderRadius: 4 }]
    },
    options: baseOptions({ indexAxis: 'y' })
  });

  // Periodo
  const perMap = aggregate(filteredData, 'Periodo', 'Alumnos');
  const perSorted = Object.entries(perMap).sort((a,b) => a[0].localeCompare(b[0]));
  destroyChart('periodo');
  charts.periodo = new Chart(document.getElementById('chartPeriodo'), {
    type: 'line',
    data: {
      labels: perSorted.map(([k]) => k),
      datasets: [{ label: 'Alumnos', data: perSorted.map(([,v]) => v), borderColor: '#6C8EEF', backgroundColor: 'rgba(108,142,239,0.15)', fill:true, tension:0.3 }]
    },
    options: baseOptions({})
  });
}

function baseOptions(extra){
  return Object.assign({
    responsive:true,
    maintainAspectRatio:false,
    plugins:{ legend:{ display:false } },
    scales:{
      x:{ ticks:{ color:'#93A4B5', font:{size:11} }, grid:{ color:'#263543' } },
      y:{ ticks:{ color:'#93A4B5', font:{size:11} }, grid:{ color:'#263543' } }
    }
  }, extra);
}

function truncate(str, n){
  str = String(str);
  return str.length > n ? str.slice(0, n-1) + '…' : str;
}

/* ======= TABLA ======= */
const TABLE_COLUMNS = ['Periodo','Carrera','Seccion','Docente','Modalidad Curso','Curso','Horario','Sesiones','Alumnos'];

function renderTable(){
  if(!document.getElementById('tableHeadRow')) return;
  const search = document.getElementById('searchInput').value.toLowerCase();

  let rows = filteredData.filter(r =>
    !search || TABLE_COLUMNS.some(c => String(r[c] ?? '').toLowerCase().includes(search))
  );

  if(sortState.key){
    rows = [...rows].sort((a,b) => {
      let va = a[sortState.key], vb = b[sortState.key];
      if(typeof va === 'number' && typeof vb === 'number') return (va-vb) * sortState.dir;
      return String(va ?? '').localeCompare(String(vb ?? '')) * sortState.dir;
    });
  }

  document.getElementById('tableHeadRow').innerHTML = TABLE_COLUMNS.map(c =>
    `<th data-key="${c}">${c}${sortState.key===c ? (sortState.dir===1 ? ' ▲' : ' ▼') : ''}</th>`
  ).join('');

  document.querySelectorAll('#tableHeadRow th').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.key;
      sortState.dir = (sortState.key === key) ? -sortState.dir : 1;
      sortState.key = key;
      renderTable();
    });
  });

  const bodyRows = rows.slice(0, 500).map(r =>
    `<tr>${TABLE_COLUMNS.map(c => `<td>${escapeHtml(r[c] ?? '')}</td>`).join('')}</tr>`
  ).join('');

  document.getElementById('tableBody').innerHTML = bodyRows || `<tr><td colspan="${TABLE_COLUMNS.length}" style="text-align:center; color:var(--ink-dim); padding:20px;">Sin resultados</td></tr>`;
  document.getElementById('tableCount').textContent = `Mostrando ${Math.min(rows.length,500)} de ${rows.length} fila(s)${rows.length>500 ? ' (límite de vista: 500)' : ''}`;
}

/* ======= AUTO ACTUALIZACIÓN ======= */
els.autoSwitch.addEventListener('click', () => {
  autoRefresh = !autoRefresh;
  els.autoSwitch.classList.toggle('on', autoRefresh);
  restartInterval();
});
els.intervalSelect.addEventListener('change', restartInterval);
els.refreshBtn.addEventListener('click', () => fetchData(true));

function restartInterval(){
  if(intervalHandle) clearInterval(intervalHandle);
  if(autoRefresh){
    const ms = Number(els.intervalSelect.value);
    intervalHandle = setInterval(() => fetchData(false), ms);
  }
}

/* ======= UTIL ======= */
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ======= INICIO ======= */
fetchData(true);
</script>
</body>
